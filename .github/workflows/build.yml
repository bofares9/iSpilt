name: Build iSpilt IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if uploaded as zip)
        run: |
          if [ -f iSpilt-iOS.zip ]; then
            unzip -q -o iSpilt-iOS.zip
          fi
          ls -la

      - name: Select latest stable Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iSpilt.xcodeproj -target iSpilt \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Release-iphoneos/iSpilt.app

      - name: Package IPA
        run: |
          APP=build/Release-iphoneos/iSpilt.app
          ldid -S "$APP/iSpilt"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry iSpilt.ipa Payload
          ls -lh iSpilt.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" iSpilt.ipa \
            --title "iSpilt build ${{ github.run_number }}" \
            --notes "iSpilt 1.0 (${{ github.run_number }})" \
            --latest

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
